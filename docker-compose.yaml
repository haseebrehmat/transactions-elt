services:
  # --- Object Storage (MinIO) ---
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data

  # --- Database (Airflow backend) ---
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Spark Cluster ---
  spark-master:
    build: ./docker/spark
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/jobs
      - ./data/iceberg:/opt/bitnami/spark/iceberg

  spark-worker:
    build: ./docker/spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    volumes:
      - ./spark_jobs:/opt/bitnami/spark/jobs
      - ./data/iceberg:/opt/bitnami/spark/iceberg

  # --- Airflow Setup & Initialization ---
  airflow-init:
    build: ./docker/airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
      - AIRFLOW__CORE__FERNET_KEY=FB1iy_f9_p9W94A_vWp9O_Vv8p9W94A_vWp9O_Vv8p9=
      - AIRFLOW__WEBSERVER__SECRET_KEY=super_secret_key_for_webserver
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true && (airflow connections get spark_default || airflow connections add 'spark_default' --conn-type 'spark' --conn-host 'spark://spark-master' --conn-port '7077')"

  # --- Airflow Services ---
  airflow-webserver:
    build: ./docker/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB1iy_f9_p9W94A_vWp9O_Vv8p9W94A_vWp9O_Vv8p9=
      - AIRFLOW__WEBSERVER__SECRET_KEY=super_secret_key_for_webserver
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
    ports:
      - "8081:8080"
    command: webserver

  airflow-scheduler:
    build: ./docker/airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=FB1iy_f9_p9W94A_vWp9O_Vv8p9W94A_vWp9O_Vv8p9=
      - AIRFLOW__WEBSERVER__SECRET_KEY=super_secret_key_for_webserver
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/airflow/spark_jobs
    command: scheduler

  # --- Analytics Dashboard ---
  dashboard:
    build:
      context: .
      dockerfile: ./docker/dashboard/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
    volumes:
      - ./dashboard:/app
    depends_on:
      - minio

networks:
  default:
    name: etl_network
